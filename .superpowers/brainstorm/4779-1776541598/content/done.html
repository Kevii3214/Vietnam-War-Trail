<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
  :root { --primary: 45, 100%, 65%; }
  .demo { background: #080c10; border-radius: 6px; padding: 24px 28px; margin-bottom: 18px; }
  .label { font-family: monospace; font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; display:block; }

  .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; font-family:'Press Start 2P',monospace; font-size:9px; cursor:pointer; }
  .btn-neon { background:transparent; color:#FFD147; border:2px solid rgba(255,209,71,0.65); border-radius:2px; text-shadow:0 0 8px rgba(255,209,71,0.5); box-shadow:0 0 6px rgba(255,209,71,0.2); transition:all .15s ease; }
  .btn-neon:hover { background:rgba(255,209,71,0.08); border-color:#FFD147; text-shadow:0 0 12px rgba(255,209,71,0.9),0 0 24px rgba(255,209,71,0.4); box-shadow:0 0 16px rgba(255,209,71,0.5),0 0 32px rgba(255,209,71,0.15); }
  .btn-dim { background:transparent; color:rgba(255,209,71,0.5); border:1.5px solid rgba(255,209,71,0.2); border-radius:2px; transition:all .15s; }
  .btn-dim:hover { color:rgba(255,209,71,0.85); border-color:rgba(255,209,71,0.55); background:rgba(255,209,71,0.05); text-shadow:0 0 8px rgba(255,209,71,0.45); }
  .btn-ghost { background:transparent; color:rgba(255,255,255,0.3); border:none; border-radius:2px; transition:color .15s; }
  .btn-ghost:hover { color:rgba(255,255,255,0.7); }
  .btn-row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }

  /* Modal */
  .modal { background:#0a0e14; border:1px solid rgba(255,209,71,0.5); border-radius:4px; max-width:280px; overflow:hidden; animation:modal-in .22s cubic-bezier(.34,1.3,.64,1) forwards; box-shadow:0 0 24px rgba(255,209,71,0.2); }
  @keyframes modal-in { from{opacity:0;transform:scale(.93) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
  .modal-hdr { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid rgba(255,209,71,0.15); background:rgba(255,209,71,0.06); }
  .modal-hdr span { font-family:'Press Start 2P',monospace; font-size:9px; color:#FFD147; text-shadow:0 0 8px rgba(255,209,71,0.6); }
  .modal-hdr button { width:22px;height:22px; border-radius:50%; background:rgba(255,255,255,0.06); border:none; color:rgba(255,255,255,0.4); font-size:12px; cursor:pointer; display:flex;align-items:center;justify-content:center; }
  .modal-item { display:flex;align-items:center;gap:10px; padding:12px 16px; font-family:'Press Start 2P',monospace; font-size:8px; color:rgba(255,255,255,0.55); border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; transition:all .15s; }
  .modal-item:last-child { border-bottom:none; }
  .modal-item:hover { background:rgba(255,209,71,0.07); color:#FFD147; }

  /* Loading */
  .spinner { width:28px;height:28px; border:2px solid rgba(255,209,71,0.15); border-top-color:#FFD147; border-radius:50%; animation:spin .85s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loading-wrap { display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:160px; }
  .loading-title { font-family:'Press Start 2P',monospace; font-size:13px; color:#FFD147; text-shadow:0 0 10px rgba(255,209,71,0.5); animation:flicker 3s infinite; }
  @keyframes flicker { 0%,100%{opacity:1}92%{opacity:1}93%{opacity:.7}94%{opacity:1}96%{opacity:.85}97%{opacity:1} }
  .loading-quote { font-family:'VT323',monospace; font-size:19px; color:rgba(255,255,255,0.3); font-style:italic; text-align:center; }
